version: "3.17"

tasks:

    dist:
        desc: Runs the build command and then publishes artifacts
        cmds:
            - task: build
            - uv run hatch publish -y

    build:
        desc: Builds distributable tar.gz and wheel files
        cmds:
            - task: check
            - uv build

    check:
        desc: Type Checks, Lints and Formats Python source files
        cmds:
            - uv sync 
            - task: type
            - task: lint 
            - task: format

    format:
        desc: Formats python source files
        cmds:
            - uv run ruff format --config pyproject.toml

    lint:
        desc: Lints python source files
        cmds:
            - uv run ruff check --config pyproject.toml
            
    
    type:
        desc: Type checks Python source files
        cmds:
            - uv run ty check
    
    bump:
        desc: Bumps the versions of Python packages
        cmds:
            - uv lock --upgrade
            - uv sync
    
    setup:
        desc: Installs dependencies and creates venv
        cmds:
            - uv python install 3.11
            - uv venv --python 3.11
            - uv lock
            - uv sync
